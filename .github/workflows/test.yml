name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Sample report is current
        run: |
          python -m tiering.tier sample/services.csv sample/dependencies.csv --report /tmp/report.md
          diff -u examples/tiering-report.md /tmp/report.md
